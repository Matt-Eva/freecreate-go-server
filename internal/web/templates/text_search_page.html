{{ define "text_search_page" }}
  <!doctype html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      {{ template "globals_component" . }}
      <link
        rel="stylesheet"
        href="/internal/web/static/css/search_nav_component.css"
      />

      {{ .CsrfToken }}
    </head>
    <body class="{{ .LoggedInClass }}">
      {{ template "header_component" . }}


      <div id="page_container">
        {{ template "sidebar_component" . }}
        <div id="page_content">
          {{ template "search_nav_component" }}
          <form>
            <input type="/submit" />
          </form>
        </div>
      </div>

      {{ template "footer_component" . }}
    </body>
  </html>
{{ end }}
